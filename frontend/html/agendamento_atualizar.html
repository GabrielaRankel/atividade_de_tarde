<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/agendamento_atualizar.js" defer></script>
    <title>Atualizar Agendamento</title>
</head>
<body>
    <header>
        <nav><a href="../index.html">Home</a></nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Atualizar Agendamento</h1>
        <form>
            <label for="id">codigo Agendamento</label><br>
            <input type="number" id="id" required><br><br>

            <label for="idCliente">codigo Cliente</label><br>
            <input type="text" id="idCliente"><br><br>

            <label for="idDrone">codigo Drone</label><br>
            <input type="email" id="idDrone"><br><br>

            <label for="data">data</label><br>
            <input type="text" id="data"><br><br>

            <label for="hora">hora</label><br>
            <input type="text" id="hora" maxlength="11"><br><br>

          
            <button id="btn_atualizar">Atualizar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
