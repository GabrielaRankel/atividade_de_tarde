<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/agendamento_cadastrar.js" defer></script>
    <title>Cadastro de agendamento</title>
</head>
<body>
    <header>
        <nav><a href="../index.html">Home</a></nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Cadastrar Agendamento</h1>
        <form>
            <label for="idCliente">Codigo Cliente</label><br>
            <input type="text" id="idCliente"><br><br>

            <label for="idDrone">Codigo Drone</label><br>
            <input type="email" id="idDrone"><br><br>

            <label for="data">Data</label><br>
            <input type="text" id="data"><br><br>

            <label for="hora">Hora</label><br>
            <input type="text" id="hora" maxlength="11"><br><br>

    
            <button id="btn_cadastrar">Cadastrar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
